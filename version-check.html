<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>线下滚动修复 · 版本自检</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:20px;background:#f5f5f7;color:#1d1d1f;line-height:1.6}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#6e6e73;font-size:13px;margin-bottom:18px}
  .card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .big{font-size:16px;font-weight:600;margin-bottom:10px}
  .ok{color:#1a7f37}.bad{color:#c9252d}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f0f0f2;font-size:13px}
  .row:last-child{border-bottom:0}
  .k{color:#6e6e73;flex:0 0 46%}
  .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;text-align:right;flex:1}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .tag-ok{background:#e7f6ec;color:#1a7f37}
  .tag-bad{background:#fdecee;color:#c9252d}
  button{margin-top:6px;padding:10px 16px;font-size:14px;border:0;border-radius:9px;background:#0071e3;color:#fff;font-weight:500;cursor:pointer}
  button.sec{background:#e8e8ed;color:#1d1d1f}
  .hint{font-size:12.5px;color:#6e6e73;margin-top:10px;padding-left:14px;border-left:3px solid #e8e8ed}
  code{background:#f0f0f2;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>线下滚动修复 · 版本自检</h1>
  <div class="sub">确认浏览器里跑的是不是修复版脚本。判据：脚本含 <code>scrollToLatestOnEnter</code>、且不含旧的 <code>scheduleStreamScroll(){ return; }</code> 死代码。</div>

  <div class="card">
    <div class="big" id="verdict">检测中…</div>
    <div class="row"><span class="k">加载到的脚本大小</span><span class="v" id="size">—</span></div>
    <div class="row"><span class="k">脚本 md5</span><span class="v" id="md5">—</span></div>
    <div class="row"><span class="k">含 scrollToLatestOnEnter</span><span class="v" id="fn">—</span></div>
    <div class="row"><span class="k">旧死代码 return; 残留</span><span class="v" id="dead">—</span></div>
    <div class="row"><span class="k">Service Worker</span><span class="v" id="sw">—</span></div>
    <div class="row"><span class="k">当前页面地址</span><span class="v" id="href">—</span></div>
  </div>

  <div class="card">
    <div class="big">如果是旧版，点这里清缓存</div>
    <button id="clear">清空缓存 + 注销 SW + 强制刷新</button>
    <button class="sec" id="reload">仅强制刷新</button>
    <div class="hint" id="tip">
      建议用 <b>无痕/隐私窗口</b> 打开测试：无痕窗口不带任何旧缓存，能立刻判断是代码问题还是缓存问题。
    </div>
  </div>
</div>

<script>
function md5Hex(buf) {
  /* 轻量 md5 实现（避免外网依赖） */
  function rl(n,c){return (n<<c)|(n>>>(32-c));}
  function au(x,y){var l=(x&0xFFFF)+(y&0xFFFF);return (((x>>16)+(y>>16)+(l>>16))<<16)|(l&0xFFFF);}
  function cmn(q,a,b,x,s,t){return au(rl(au(au(a,q),au(x,t)),s),b);}
  function ff(a,b,c,d,x,s,t){return cmn((b&c)|(~b&d),a,b,x,s,t);}
  function gg(a,b,c,d,x,s,t){return cmn((b&d)|(c&~d),a,b,x,s,t);}
  function hh(a,b,c,d,x,s,t){return cmn(b^c^d,a,b,x,s,t);}
  function ii(a,b,c,d,x,s,t){return cmn(c^(b|~d),a,b,x,s,t);}
  function tb(str){var n=str.length,bl=[];for(var i=0;i<64;i++)bl[i]=0;
    for(i=0;i<n;i++)bl[i>>2]|=str.charCodeAt(i)<<((i%4)*8);
    bl[n>>2]|=0x80<<((n%4)*8);
    var l=n*8;bl[((n+8>>6)+1)*16-2]=l&0xFFFFFFFF;bl[((n+8>>6)+1)*16-1]=Math.floor(l/0x100000000);
    return bl;}
  var s=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
         4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  var K=[];for(var i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*0x100000000);
  var a=1732584193,b=-271733879,c=-1732584194,d=271733878;
  var bl=tb(buf);
  for(i=0;i<bl.length;i+=16){
    var oa=a,ob=b,oc=c,od=d;
    a=ff(a,b,c,d,bl[i],s[0],K[0]);d=ff(d,a,b,c,bl[i+1],s[1],K[1]);c=ff(c,d,a,b,bl[i+2],s[2],K[2]);b=ff(b,c,d,a,bl[i+3],s[3],K[3]);
    a=ff(a,b,c,d,bl[i+4],s[4],K[4]);d=ff(d,a,b,c,bl[i+5],s[5],K[5]);c=ff(c,d,a,b,bl[i+6],s[6],K[6]);b=ff(b,c,d,a,bl[i+7],s[7],K[7]);
    a=ff(a,b,c,d,bl[i+8],s[8],K[8]);d=ff(d,a,b,c,bl[i+9],s[9],K[9]);c=ff(c,d,a,b,bl[i+10],s[10],K[10]);b=ff(b,c,d,a,bl[i+11],s[11],K[11]);
    a=ff(a,b,c,d,bl[i+12],s[12],K[12]);d=ff(d,a,b,c,bl[i+13],s[13],K[13]);c=ff(c,d,a,b,bl[i+14],s[14],K[14]);b=ff(b,c,d,a,bl[i+15],s[15],K[15]);
    a=gg(a,b,c,d,bl[i+1],s[16],K[16]);d=gg(d,a,b,c,bl[i+6],s[17],K[17]);c=gg(c,d,a,b,bl[i+11],s[18],K[18]);b=gg(b,c,d,a,bl[i],s[19],K[19]);
    a=gg(a,b,c,d,bl[i+5],s[20],K[20]);d=gg(d,a,b,c,bl[i+10],s[21],K[21]);c=gg(c,d,a,b,bl[i+15],s[22],K[22]);b=gg(b,c,d,a,bl[i+4],s[23],K[23]);
    a=gg(a,b,c,d,bl[i+9],s[24],K[24]);d=gg(d,a,b,c,bl[i+14],s[25],K[25]);c=gg(c,d,a,b,bl[i+3],s[26],K[26]);b=gg(b,c,d,a,bl[i+8],s[27],K[27]);
    a=gg(a,b,c,d,bl[i+13],s[28],K[28]);d=gg(d,a,b,c,bl[i+2],s[29],K[29]);c=gg(c,d,a,b,bl[i+7],s[30],K[30]);b=gg(b,c,d,a,bl[i+12],s[31],K[31]);
    a=hh(a,b,c,d,bl[i+5],s[32],K[32]);d=hh(d,a,b,c,bl[i+8],s[33],K[33]);c=hh(c,d,a,b,bl[i+11],s[34],K[34]);b=hh(b,c,d,a,bl[i+14],s[35],K[35]);
    a=hh(a,b,c,d,bl[i+1],s[36],K[36]);d=hh(d,a,b,c,bl[i+4],s[37],K[37]);c=hh(c,d,a,b,bl[i+7],s[38],K[38]);b=hh(b,c,d,a,bl[i+10],s[39],K[39]);
    a=hh(a,b,c,d,bl[i+13],s[40],K[40]);d=hh(d,a,b,c,bl[i],s[41],K[41]);c=hh(c,d,a,b,bl[i+3],s[42],K[42]);b=hh(b,c,d,a,bl[i+6],s[43],K[43]);
    a=hh(a,b,c,d,bl[i+9],s[44],K[44]);d=hh(d,a,b,c,bl[i+12],s[45],K[45]);c=hh(c,d,a,b,bl[i+15],s[46],K[46]);b=hh(b,c,d,a,bl[i+2],s[47],K[47]);
    a=ii(a,b,c,d,bl[i],s[48],K[48]);d=ii(d,a,b,c,bl[i+7],s[49],K[49]);c=ii(c,d,a,b,bl[i+14],s[50],K[50]);b=ii(b,c,d,a,bl[i+5],s[51],K[51]);
    a=ii(a,b,c,d,bl[i+12],s[52],K[52]);d=ii(d,a,b,c,bl[i+3],s[53],K[53]);c=ii(c,d,a,b,bl[i+10],s[54],K[54]);b=ii(b,c,d,a,bl[i+1],s[55],K[55]);
    a=ii(a,b,c,d,bl[i+8],s[56],K[56]);d=ii(d,a,b,c,bl[i+15],s[57],K[57]);c=ii(c,d,a,b,bl[i+6],s[58],K[58]);b=ii(b,c,d,a,bl[i+13],s[59],K[59]);
    a=ii(a,b,c,d,bl[i+4],s[60],K[60]);d=ii(d,a,b,c,bl[i+11],s[61],K[61]);c=ii(c,d,a,b,bl[i+2],s[62],K[62]);b=ii(b,c,d,a,bl[i+9],s[63],K[63]);
    a=au(a,oa);b=au(b,ob);c=au(c,oc);d=au(d,od);
  }
  function hx(n){var s='',j;for(j=0;j<4;j++)s+=('0'+((n>>(j*8))&0xFF).toString(16)).slice(-2);return s;}
  return hx(a)+hx(b)+hx(c)+hx(d);
}

(async function () {
  var el = function (id) { return document.getElementById(id); };
  el('href').textContent = location.href;

  // SW 状态
  try {
    var regs = await navigator.serviceWorker.getRegistrations();
    el('sw').textContent = regs.length ? (regs.length + ' 个已注册') : '无（未启用）';
  } catch (e) { el('sw').textContent = '读取失败'; }

  // 用绕过缓存的方式取脚本
  var url = 'js1/miya-appointment-app.js?v=54&_probe=' + Date.now();
  try {
    var res = await fetch(url, { cache: 'no-store' });
    var txt = await res.text();
    var size = new Blob([txt]).size;
    el('size').textContent = size + ' 字节';
    var m = md5Hex(txt);
    el('md5').textContent = m;
    var hasFn = txt.indexOf('scrollToLatestOnEnter') >= 0;
    var hasDead = /function scheduleStreamScroll\(\)\s*\{\s*\n\s*return;/.test(txt);
    el('fn').textContent = hasFn ? '✅ 是' : '❌ 否';
    el('dead').textContent = hasDead ? '❌ 有（旧版）' : '✅ 无';

    var good = (hasFn && !hasDead) || (size >= 175000);
    el('verdict').innerHTML = good
      ? '<span class="tag tag-ok">✅ 已是修复版</span>'
      : '<span class="tag tag-bad">❌ 仍是旧版（缓存未更新）</span>';
  } catch (e) {
    el('verdict').innerHTML = '<span class="tag tag-bad">取脚本失败</span> ' + e.message;
  }
})();

document.getElementById('clear').addEventListener('click', async function () {
  try {
    var ks = await caches.keys();
    await Promise.all(ks.map(function (k) { return caches.delete(k); }));
    var regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(function (r) { return r.unregister(); }));
    location.reload(true);
  } catch (e) { alert('清理出错：' + e.message); }
});
document.getElementById('reload').addEventListener('click', function () { location.reload(true); });
</script>
</body>
</html>
