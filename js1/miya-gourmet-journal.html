<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大陆美食物语 · 冒险者手札</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==================== 阳光西幻复古配色变量 ==================== */
    :root {
      --sun-tab-bg: #55775a;
      --sun-tab-hover: #638366;
      --sun-border-dark: #4a382c;
      --sun-card-bg: #f6eedd;
      --sun-card-hover: #faefe0;
      --sun-card-border: #d5c3a5;
      --sun-card-border-active: #896447;
      --sun-text-main: #4a382c;
      --sun-text-sub: #72533b;
      --sun-accent-orange: #b85d19;
      --sun-accent-red: #b03a2e;
      --sun-accent-gold: #c29339;
      --sun-tab-active-bg: #f0dfbc;
      --sun-tab-active-text: #61462f;
      --sun-tab-accent: #d59b62;
      --sun-panel-bg: #fbf6ec;
      --sun-inset-border: #c2a272;
      /* 置顶卡片专用明亮暖金色系 */
      --pinned-bg: #f7ecd3;
      --pinned-border: #a46b38;
      /* 专供Emoji徽章浮雕描边的配色 */
      --stroke-dark: #4a382c;
      --stroke-light: #fbf6ec;
      /* 专属羊皮信纸与木板质感 */
      --parchment-bg: #fcf6e8;
      --parchment-border: #cbb493;
      --wax-red: #9e2a2b;
      --wax-gold: #a77c37;
      --board-bg: #ede1cb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: transparent;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      font-family: 'Noto Serif SC', 'Playfair Display', serif;
      color: var(--sun-text-main);
      overflow-x: hidden;
    }

    /* ==================== 新增外层容器：负责居中与裁剪 ==================== */
    .gourmet-outer-container {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ==================== 状态栏根容器与缩放 ==================== */
    .gourmet-status-wrapper {
      width: 390px;
      flex-shrink: 0;
      transform-origin: top center;
      transition: transform 0.15s ease-out;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .gourmet-status-panel {
      width: 100%;
      background: var(--sun-panel-bg);
      border: 3px solid var(--sun-border-dark);
      border-radius: 18px;
      box-shadow: 0 6px 0 var(--sun-border-dark), 0 12px 24px rgba(60, 40, 25, 0.2);
      display: flex;
      flex-direction: column;
      height: auto;
      overflow: hidden;
      position: relative;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 默认折叠状态面板高度适配 */
    .gourmet-status-panel.is-collapsed {
      height: auto;
    }

    /* ==================== 厨师身份卡 (折叠/展开标头) ==================== */
    .chef-id-card {
      background: linear-gradient(135deg, #f7ebd4 0%, #ecdcc0 100%);
      border-bottom: 3px solid var(--sun-border-dark);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: background 0.2s ease;
    }
    .chef-id-card:hover {
      background: linear-gradient(135deg, #fbf1de 0%, #f0e1c7 100%);
    }
    .id-card-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* --- 头像与头像框层叠 --- */
    .id-avatar-frame {
      position: relative;
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .id-avatar-frame .user-avatar {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      z-index: 1;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
      background-color: #dfcaa7;
    }
    .id-avatar-frame::after {
      content: '';
      position: absolute;
      top: -6px; /* 头像框上移6px */
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('https://img.baibai.cv/f/1omqt2/Frame2.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2;
      pointer-events: none;
    }

    /* --- 身份信息文本 --- */
    .id-info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .id-name-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .id-chef-name {
      font-size: 14.5px;
      font-weight: 900;
      color: #3b281c;
      letter-spacing: 0.5px;
    }
    .id-chef-title {
      font-size: 10px;
      font-weight: 700;
      background: #dfcaa7;
      color: #593e27;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #896447;
      white-space: nowrap;
    }
    .id-meta-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 1px;
    }
    .id-level-badge {
      color: #fff;
      background: var(--sun-tab-bg);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      border: 1px solid var(--sun-border-dark);
    }
    .id-fame-text {
      color: var(--sun-accent-orange);
      font-size: 10.5px;
    }

    /* --- 新版：铭言卷轴卡槽（羊皮纸底纹+横线） --- */
    .chef-quote-plaque {
      position: relative;
      background-color: #efe1c6; /* 参考身份卡评价底色 */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent calc(20px - 1px),
        rgba(150, 116, 76, 0.18) calc(20px - 1px),
        rgba(150, 116, 76, 0.18) 20px
      );
      border: 1px solid #c5a77c; /* 参考边框颜色 */
      border-radius: 4px 7px 7px 4px; /* 参考圆角 */
      padding: 12px 14px 10px 18px;
      box-shadow: 0 3px 8px rgba(74, 56, 44, 0.07), inset 0 0 14px rgba(178, 143, 95, 0.12); /* 参考阴影 */
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* 大号水印引号 */
    .quote-watermark {
      position: absolute;
      left: 10px;
      top: -4px;
      font-size: 32px;
      font-family: 'Playfair Display', serif;
      line-height: 1;
      color: rgba(155, 121, 83, 0.7); /* 匹配参考引号颜色 */
      pointer-events: none;
      user-select: none;
    }
    /* 正文评价：自动换行、行高优美 */
    .chef-quote-text {
      font-size: 12.5px;
      line-height: 1.6;
      color: #644a34; /* 参考文字颜色 */
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0.3px;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }
    /* 底部操作行：标签与折叠按钮 */
    .quote-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #decab0;
      padding-top: 6px;
      margin-top: 2px;
    }
    .quote-tag-seal {
      font-size: 9.5px;
      font-weight: 700;
      color: #8c6a43;
      letter-spacing: 0.5px;
    }
    .fold-toggle-pill {
      font-size: 10.5px;
      font-weight: 700;
      color: #4a382c;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #e8d7bb;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid #c2a272;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      cursor: pointer;
    }
    .is-open-panel .fold-toggle-pill .arrow-icon {
      transform: rotate(180deg);
    }

    /* ==================== 手札主体内容容器 (支持折叠隐藏) ==================== */
    .gourmet-foldable-body {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      overflow: hidden;
    }
    .gourmet-status-panel.is-collapsed .gourmet-foldable-body {
      display: none;
    }

    /* ==================== 顶部 Tab 栏 ==================== */
    .gourmet-tabs-bar {
      display: flex;
      background: var(--sun-tab-bg);
      border-bottom: 3px solid var(--sun-border-dark);
      padding: 6px;
      gap: 4px;
      align-items: stretch;
    }
    .gourmet-tab-btn {
      flex: 1;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: 8px;
      height: 36px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #eee2c6;
      letter-spacing: 1px;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .gourmet-tab-btn::before,
    .gourmet-tab-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #b89a67;
      opacity: 0.7;
    }
    .gourmet-tab-btn::before {
      left: 4px;
    }
    .gourmet-tab-btn::after {
      right: 4px;
    }
    .gourmet-tab-btn:hover:not(.active) {
      background: var(--sun-tab-hover);
    }
    .gourmet-tab-btn.active {
      color: var(--sun-tab-active-text);
      background: var(--sun-tab-active-bg);
      box-shadow: inset 0 -2px 0 #c2a272;
    }
    .gourmet-tab-btn.active span {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 4px;
      border-radius: 3px;
      background: var(--sun-card-border-active);
    }
    .gourmet-tab-btn.active span::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 2px;
      border-radius: 2px;
      background: var(--sun-tab-accent);
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    /* ==================== 滚动内容视口 ==================== */
    .gourmet-content-viewport {
      max-height: 420px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .gourmet-content-viewport::-webkit-scrollbar {
      width: 5px;
    }
    .gourmet-content-viewport::-webkit-scrollbar-thumb {
      background: var(--sun-card-border);
      border-radius: 4px;
    }
    .gourmet-tab-page {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .gourmet-tab-page.active {
      display: flex;
    }

    /* ==================== 模块 1：情报站条目 ==================== */
    .pinned-intel-card {
      background: var(--pinned-bg);
      border: 2px solid var(--pinned-border);
      border-radius: 12px;
      padding: 12px 64px 12px 12px;
      position: relative;
      box-shadow: 0 3px 6px rgba(164, 107, 56, 0.15), inset 0 0 0 2px #fff3db;
      margin-top: 4px;
    }
    .pinned-badge-tag {
      position: absolute;
      top: -9px;
      left: 10px;
      background: var(--sun-accent-red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 4px;
      border: 1.5px solid var(--sun-border-dark);
      box-shadow: 1px 1px 0 var(--sun-border-dark);
      letter-spacing: 0.5px;
      transform: rotate(-2deg);
    }
    .pinned-intel-card .card-title {
      font-size: 14px;
      font-weight: 900;
      color: #3b281c;
      margin-bottom: 4px;
    }
    .pinned-intel-card .card-desc {
      font-size: 11.5px;
      line-height: 1.5;
      color: #61462f;
    }
    .pinned-intel-card .intel-action-cue {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--sun-accent-orange);
      border-top: 1px dashed #d9b88f;
      padding-top: 4px;
    }
    .badge-sticker-wrapper {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .badge-sticker-emoji {
      font-size: 34px;
      line-height: 1;
      display: inline-block;
      user-select: none;
      animation: float-gourmet 4s ease-in-out infinite;
      text-shadow: 2px 0 0 var(--stroke-dark), -2px 0 0 var(--stroke-dark), 0 2px 0 var(--stroke-dark), 0 -2px 0 var(--stroke-dark), 1.5px 1.5px 0 var(--stroke-dark), -1.5px -1.5px 0 var(--stroke-dark), 1.5px 1.5px 0 var(--stroke-dark), -1.5px 1.5px 0 var(--stroke-dark), 3px 0 0 var(--stroke-light), -3px 0 0 var(--stroke-light), 0 3px 0 var(--stroke-light), 0 -3px 0 var(--stroke-light), 2.5px 2.5px 0 var(--stroke-light), -2.5px -2.5px 0 var(--stroke-light);
    }
    @keyframes float-gourmet {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-3px) rotate(5deg);
      }
    }
    .intel-card-plain {
      background: var(--sun-card-bg);
      border: 1.5px solid var(--sun-card-border);
      border-radius: 10px;
      padding: 10px 12px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(74, 56, 44, 0.04);
    }
    .intel-card-plain:hover {
      border-color: var(--sun-card-border-active);
      background: var(--sun-card-hover);
    }
    .intel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .intel-category-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--sun-card-border-active);
    }
    .cat-recipe {
      background: #dce7dc;
      color: #2e5333;
    }
    .cat-rival {
      background: #fae1cd;
      color: var(--sun-accent-orange);
    }
    .cat-trend {
      background: #fdf1d6;
      color: #825b16;
    }
    .cat-fame {
      background: #e8e3f3;
      color: #493b70;
    }
    .cat-secret {
      background: #ece5d8;
      color: #5c4333;
    }
    .intel-card-plain .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--sun-text-main);
    }
    .intel-card-plain .card-desc {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--sun-text-sub);
    }
    .intel-card-plain .intel-action-cue {
      margin-top: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--sun-accent-orange);
      border-top: 1px dashed var(--sun-card-border);
      padding-top: 3px;
    }

    /* ==================== 模块 2：结识人物与信箱 ==================== */
    .section-label-bar {
      font-size: 12px;
      font-weight: 900;
      color: var(--sun-card-border-active);
      border-bottom: 2px solid var(--sun-card-border);
      padding-bottom: 3px;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
    .npc-card {
      background: var(--sun-card-bg);
      border: 2px solid var(--sun-card-border);
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 6px rgba(74, 56, 44, 0.06);
    }
    .npc-card:hover {
      border-color: var(--sun-card-border-active);
      background: var(--sun-card-hover);
    }
    .npc-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .npc-avatar-box {
      width: 66px;
      height: 66px;
      border-radius: 10px;
      border: 2px solid var(--sun-card-border-active);
      background: #e8d7bb;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(74, 56, 44, 0.15), inset 0 0 4px rgba(0, 0, 0, 0.1);
    }
    .npc-avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .npc-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .npc-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--sun-text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .npc-relation-tag {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #ebd8b6;
      color: var(--sun-text-sub);
      border: 1px solid var(--sun-card-border);
      white-space: nowrap;
    }
    .npc-impression {
      font-size: 11.5px;
      color: var(--sun-text-sub);
      margin-top: 4px;
      line-height: 1.45;
    }
    .npc-expand-icon {
      font-size: 11px;
      color: var(--sun-card-border-active);
      transition: transform 0.25s ease;
      padding-left: 4px;
    }
    .npc-card.is-open .npc-expand-icon {
      transform: rotate(180deg);
    }
    .npc-heart-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.3s ease;
      border-top: 1.5px dashed var(--sun-inset-border);
      margin-top: 0;
      padding-top: 0;
    }
    .npc-card.is-open .npc-heart-panel {
      max-height: 200px;
      opacity: 1;
      margin-top: 10px;
      padding-top: 8px;
    }

    /* --- 新版：带尖角的心声气泡 (Speech Bubble with Tail) --- */
    .npc-speech-bubble {
      position: relative;
      background: #fdfaf2;
      border: 1.5px solid #cbaf89;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 3px 8px rgba(74, 56, 44, 0.08);
    }
    /* 气泡尖角（外边框） */
    .npc-speech-bubble::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 24px;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 7px solid #cbaf89;
    }
    /* 气泡尖角（内部填充色，遮盖内边框） */
    .npc-speech-bubble::after {
      content: '';
      position: absolute;
      top: -5px;
      left: 25px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 6px solid #fdfaf2;
    }
    /* 心声标题条 */
    .bubble-header {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
      font-size: 10px;
      font-weight: 900;
      color: var(--sun-accent-orange);
      letter-spacing: 0.5px;
    }
    .bubble-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #ebd8b6, transparent);
    }
    /* 气泡内长文本：无省略号，完整自适应换行 */
    .bubble-text-content {
      font-size: 12px;
      line-height: 1.6;
      color: #553d2d;
      font-style: italic;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      letter-spacing: 0.2px;
    }

    /* --- 信箱系统 --- */
    .mailbox-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mail-envelope {
      background: #f4ecdd;
      border: 2px solid var(--sun-card-border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 3px 6px rgba(74, 56, 44, 0.05);
      position: relative;
    }
    .mail-envelope:hover {
      border-color: var(--sun-card-border-active);
      background: #f9f2e6;
    }
    .mail-envelope.is-open {
      border-color: var(--sun-card-border-active);
      background: #f8f1e3;
      box-shadow: 0 4px 10px rgba(74, 56, 44, 0.09);
    }
    .mail-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mail-wax-stamp {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wax-seal {
      width: 14px;
      height: 14px;
      border-radius: 50%;

<body>
  <!-- 隐藏容器接收 AI 纯文本标记 -->
  <div id="gourmet-raw-data" style="display:none;">$1</div>

  <!-- 外层容器：负责居中与裁剪 -->
  <div class="gourmet-outer-container" id="outerContainer">
    <div class="gourmet-status-wrapper" id="statusRoot">
      <!-- 默认状态添加 is-collapsed -->
      <div class="gourmet-status-panel is-collapsed" id="statusPanel">
        <!-- ==================== 厨师身份卡 (顶部常驻/点击折叠展开) ==================== -->
        <div class="chef-id-card" onclick="toggleStatusPanel()">

            </div>
            <!-- 身份属性与等级 -->
            <div class="id-info-col">
              <div class="id-name-title-row">
                <span class="id-chef-name" id="chefName">--</span>
                <span class="id-chef-title" id="chefTitle">--</span>
              </div>
              <div class="id-meta-pills">

          <!-- 新版评价模块结构：铭言卷轴卡槽 -->
          <div class="chef-quote-plaque">

            <div class="quote-footer-row">

        <!-- ==================== 可折叠的手札主要内容部分 ==================== -->
        <div class="gourmet-foldable-body">
          <!-- 顶部手绘Tab栏 -->
          <div class="gourmet-tabs-bar">
            <button class="gourmet-tab-btn active" onclick="switchGourmetTab('intel', this)">情报<span></span></button>
            <button class="gourmet-tab-btn" onclick="switchGourmetTab('npc', this)">结识<span></span></button>
            <button class="gourmet-tab-btn" onclick="switchGourmetTab('quest', this)">任务<span></span></button>

          <!-- 主内容视口 -->
          <div class="gourmet-content-viewport">
            <!-- ==================== TAB 1: 核心行动情报站 ==================== -->
            <div id="tab-intel" class="gourmet-tab-page active"></div>

            <!-- ==================== TAB 2: 结识人物与信箱 ==================== -->
            <div id="tab-npc" class="gourmet-tab-page">
              <div class="section-label-bar">在场旅人</div>

            <div id="tab-quest" class="gourmet-tab-page">
              <div class="section-label-bar">当前使命与赏金</div>
              <div id="quest-list-container" style="display:flex; flex-direction:column; gap:10px;"></div>
              <div class="section-label-bar">随身行动便笺</div>
              <div class="todo-memo-paper">
                <div class="todo-memo-tape"></div>
                <div class="todo-list-container" id="todo-list-container"></div>
              </div>

            <!-- ==================== TAB 4: 冒险者酒馆留言板 (论坛) ==================== -->

            </div>

          <!-- 底部缩放控制栏 -->
          <div class="gourmet-bottom-bar">
            <div class="gourmet-scale-box">
              <button class="scale-btn" onclick="event.stopPropagation(); changeUIScale(-0.1)">-</button>
              <div class="scale-val" id="scaleDisplay">100%</div>
              <button class="scale-btn" onclick="event.stopPropagation(); changeUIScale(0.1)">+</button>

  <script>
    /* ==================== NPC 头像映射字典 ==================== */
    const NPC_AVATAR_MAP = {
      '伊恩': 'https://img.baibai.cv/f/aZvaSR/ian2.png',
      '莱纳斯': 'https://img.baibai.cv/f/k1QghX/linus2.png',
      '伊弗': 'https://img.baibai.cv/f/2oNziX/evo2.png',
      '塞雷诺': 'https://img.baibai.cv/f/zonxFD/sere2.png',
      '西奥多': 'https://img.baibai.cv/f/DneAse/theo2.png'
    };
    const DEFAULT_NPC_AVATAR = 'https://img.baibai.cv/f/PPXDcg/npc1.jpg';

    // 可扩展的别名映射表
    const NPC_ALIAS_MAP = {
      '赛雷诺': '塞雷诺'
    };

    function resolveNpcAvatar(name) {
      if (!name) return DEFAULT_NPC_AVATAR;

      let resolvedName = name;
      for (const alias in NPC_ALIAS_MAP) {
        if (name.includes(alias)) {
          resolvedName = NPC_ALIAS_MAP[alias];
          break;
        }
      }

      for (const key in NPC_AVATAR_MAP) {
        if (resolvedName.includes(key)) return NPC_AVATAR_MAP[key];
      }
      return DEFAULT_NPC_AVATAR;
    }

    function getCategoryClass(cat) {
      if (!cat) return 'cat-recipe';
      if (cat.includes('传闻') || cat.includes('食谱') || cat.includes('技法')) return 'cat-recipe';
      if (cat.includes('劲敌') || cat.includes('对手')) return 'cat-rival';
      if (cat.includes('时令') || cat.includes('风向') || cat.includes('商机')) return 'cat-trend';
      if (cat.includes('见报') || cat.includes('声望')) return 'cat-fame';
      if (cat.includes('秘闻') || cat.includes('暗线') || cat.includes('传说')) return 'cat-secret';
      return 'cat-recipe';
    }

    function getTagClass(tag) {
      if (!tag) return 'tag-help';
      if (tag.includes('悬赏') || tag.includes('重金') || tag.includes('赏金')) return 'tag-bounty';
      return 'tag-help';
    }

    /* ==================== 结构化解析核心 ==================== */
    function parseGourmetBlocks(rawText) {
      if (!rawText) return [];
      const cleanText = rawText.replace(/^[\s\S]*?<\/(?:think|thinking)>/i, '').trim();
      const blocks = [];
      let currentBlock = "";
      let depth = 0;

      for (let i = 0; i < cleanText.length; i++) {
        const char = cleanText[i];
        if (char === '[') {
          if (depth > 0) currentBlock += char;
          depth++;
        } else if (char === ']') {
          depth--;
          if (depth === 0) {
            if (currentBlock.trim()) blocks.push(currentBlock);
            currentBlock = "";
          } else if (depth > 0) {
            currentBlock += char;
          } else {
            depth = 0;
          }
        } else {
          if (depth > 0) currentBlock += char;
        }
      }
      if (depth > 0 && currentBlock.trim()) blocks.push(currentBlock);
      return blocks;
    }

    function renderGourmetJournal() {
      const rawEl = document.getElementById('gourmet-raw-data');
      if (!rawEl) return;
      const blocks = parseGourmetBlocks(rawEl.innerText || rawEl.textContent);
      let parsed = {
        profile: null,
        pinnedIntel: null,
        intels: [],
        npcs: [],
        mails: [],
        mainQuest: null,
        sideQuests: [],
        todos: [],
        posts: []
      };
      let currentPost = null;

      blocks.forEach(blockStr => {
        const parts = blockStr.split('|').map(s => s.trim());
        const header = (parts[0] || '').toLowerCase();

        if (header === 'profile') {
          parsed.profile = {
            name: parts[1] || '{{user}}',
            title: parts[2] || '游历学徒',
            level: parts[3] || 'Lv.1 见习主厨',
            fame: parts[4] || '声望: 暂无名气',
            quote: parts[5] || '刀锋与香料的旅程刚刚启程。'
          };
        } else if (header === 'pinned') {
          parsed.pinnedIntel = {
            emoji: parts[1] || '🏆',
            tag: parts[2] || '赛事特急',
            title: parts[3] || '大陆美食竞技',
            desc: parts[4] || '暂无详细情报说明。',
            cue: parts[5] || '行动指引：做好准备。'
          };
        } else if (header === 'card') {
          parsed.intels.push({
            category: parts[1] || '情报',
            title: parts[2] || '神秘消息',
            desc: parts[3] || '暂无描述',
            cue: parts[4] || ''
          });
        } else if (header === 'npc') {
          parsed.npcs.push({
            name: parts[1] || '神秘旅人',
            tag: parts[2] || '旅人',
            impression: parts[3] || '初次相遇',
            heart: parts[4] || '……'
          });
        } else if (header === 'mail') {
          parsed.mails.push({
            sender: parts[1] || '未知寄件人',
            date: parts[2] || '近期',
            subject: parts[3] || '一封手书',
            body: parts[4] || '',
            sign: parts[5] || '公会信使',
            giftName: parts[6] || '',
            giftSub: parts[7] || '',
            giftStatus: parts[8] || '已随信附送'
          });
        } else if (header === 'mainquest') {
          parsed.mainQuest = {
            title: parts[1] || '当前主线使命',
            progress: parts[2] || '进行中',
            desc: parts[3] || '跟随命运指引探索大陆。',
            reward: parts[4] || ''
          };
        } else if (header === 'sidequest') {
          parsed.sideQuests.push({
            title: parts[1] || '委托',
            status: parts[2] || '进行中',
            desc: parts[3] || '',
            reward: parts[4] || ''
          });
        } else if (header === 'todo') {
          parsed.todos.push({
            done: parts[1] === '1' || parts[1] === 'true',
            text: parts[2] || parts.slice(1).join('|')
          });
        } else if (header === 'post') {
          currentPost = {
            author: parts[1] || '匿名酒客',
            role: parts[2] || '见习冒险者',
            tag: parts[3] || '求助交流',
            title: parts[4] || '酒馆杂谈',
            content: parts[5] || '',
            replies: []
          };
          parsed.posts.push(currentPost);
        } else if (header === 'reply') {
          if (currentPost) {
            currentPost.replies.push({
              author: parts[1] || '路过酒客',
              time: parts[2] || '刚刚',
              content: parts.slice(3).join('|') || parts[3] || ''
            });
          }
        }
      });

      // 1. 渲染 Header (Profile)
      if (parsed.profile) {
        document.getElementById('chefName').innerText = parsed.profile.name;
        document.getElementById('chefTitle').innerText = parsed.profile.title;
        document.getElementById('chefLevel').innerText = parsed.profile.level;
        document.getElementById('chefFame').innerText = parsed.profile.fame;
        document.getElementById('chefQuote').innerText = `“${parsed.profile.quote}”`;
      }

      // 2. 渲染 Tab 1: Intel
      const intelTab = document.getElementById('tab-intel');
      let intelHtml = '';
      if (parsed.pinnedIntel) {
        intelHtml += `
          <div class="pinned-intel-card">
            <div class="pinned-badge-tag">${parsed.pinnedIntel.tag}</div>
            <div class="card-title">${parsed.pinnedIntel.title}</div>
            <div class="card-desc">${parsed.pinnedIntel.desc}</div>
            ${parsed.pinnedIntel.cue ? `<div class="intel-action-cue">${parsed.pinnedIntel.cue}</div>` : ''}
            <div class="badge-sticker-wrapper">
              <div class="badge-sticker-emoji">${parsed.pinnedIntel.emoji}</div>
            </div>
          </div>
        `;
      }
      parsed.intels.forEach(item => {
        const catCls = getCategoryClass(item.category);
        intelHtml += `
          <div class="intel-card-plain">
            <div class="intel-header-row">
              <div class="card-title">${item.title}</div>
              <span class="intel-category-tag ${catCls}">${item.category}</span>
            </div>
            <div class="card-desc">${item.desc}</div>
            ${item.cue ? `<div class="intel-action-cue">${item.cue}</div>` : ''}
          </div>
        `;
      });
      intelTab.innerHTML = intelHtml;

      // 3. 渲染 Tab 2: NPCs & Mails
      const npcContainer = document.getElementById('npc-list-container');
      let npcHtml = '';
      parsed.npcs.forEach(npc => {
        const avatarUrl = resolveNpcAvatar(npc.name);
        npcHtml += `
          <div class="npc-card" onclick="toggleFold(this)">
            <div class="npc-header">
              <div class="npc-avatar-box">
                <img src="${avatarUrl}" alt="${npc.name}">
              </div>
              <div class="npc-meta">
                <div class="npc-name">
                  <span>${npc.name}</span>
                  <span class="npc-relation-tag">${npc.tag}</span>
                </div>
                <div class="npc-impression">${npc.impression}</div>
              </div>
              <div class="npc-expand-icon">▼</div>
            </div>
            <div class="npc-heart-panel">
              <div class="npc-speech-bubble">
                <div class="bubble-header">✦ 心声 ✦</div>
                <div class="bubble-text-content">${npc.heart}</div>
              </div>
            </div>
          </div>
        `;
      });
      npcContainer.innerHTML = npcHtml;

      const mailContainer = document.getElementById('mail-list-container');
      let mailHtml = '';
      parsed.mails.forEach(mail => {
        let giftBlock = '';
        if (mail.giftName) {
          giftBlock = `
            <div class="letter-gift-box">
              <div class="gift-info">
                <div class="gift-icon-frame">信物</div>
                <div class="gift-text-group">
                  <span class="gift-name">${mail.giftName}</span>
                  <span class="gift-sub">${mail.giftSub}</span>
                </div>
              </div>
              <div class="gift-status-badge">${mail.giftStatus}</div>
            </div>
          `;
        }
        mailHtml += `
          <div class="mail-envelope" onclick="toggleFold(this)">
            <div class="mail-top-row">
              <div class="mail-wax-stamp">
                <div class="wax-seal"></div>
                <span class="mail-sender-name">${mail.sender}</span>
              </div>
              <span class="mail-date-stamp">${mail.date}</span>
            </div>
            <div class="mail-subject-line">${mail.subject}</div>
            <div class="parchment-letter-fold">
              <div class="parchment-paper">
                <div class="letter-body">${mail.body}</div>
                <div class="letter-sign">—— ${mail.sign}</div>
                ${giftBlock}
              </div>
            </div>
          </div>
        `;
      });
      mailContainer.innerHTML = mailHtml;

      // 4. 渲染 Tab 3: Quests & Todos
      const questContainer = document.getElementById('quest-list-container');
      let questHtml = '';
      if (parsed.mainQuest) {
        questHtml += `
          <div class="quest-item main-quest">
            <div class="quest-header">
              <span style="color:var(--sun-accent-orange);">【主线】${parsed.mainQuest.title}</span>
              <span style="font-size:10.5px;color:var(--sun-text-sub);">进度: ${parsed.mainQuest.progress}</span>
            </div>
            <div class="quest-desc">${parsed.mainQuest.desc}</div>
            ${parsed.mainQuest.reward ? `<div class="quest-reward">赏金：${parsed.mainQuest.reward}</div>` : ''}
          </div>
        `;
      }
      parsed.sideQuests.forEach(sq => {
        questHtml += `
          <div class="quest-item">
            <div class="quest-header">
              <span>【委托】${sq.title}</span>
              <span style="font-size:10.5px;color:var(--sun-text-sub);">${sq.status}</span>
            </div>
            <div class="quest-desc">${sq.desc}</div>
            ${sq.reward ? `<div class="quest-reward">赏金：${sq.reward}</div>` : ''}
          </div>
        `;
      });
      questContainer.innerHTML = questHtml;

      const todoContainer = document.getElementById('todo-list-container');
      let todoHtml = '';
      parsed.todos.forEach(todo => {
        todoHtml += `
          <div class="todo-item ${todo.done ? 'done' : ''}" onclick="toggleTodo(this)">
            <div class="todo-check">✓</div>
            <div class="todo-text">${todo.text}</div>
          </div>
        `;
      });
      todoContainer.innerHTML = todoHtml;

      // 5. 渲染 Tab 4: Forum Posts
      const forumContainer = document.getElementById('forum-board-container');
      let forumHtml = '';
      parsed.posts.forEach(post => {
        const tagCls = getTagClass(post.tag);
        const sigil = (post.author || '冒').trim().substring(0, 1);
        let repliesHtml = '';
        post.replies.forEach(r => {
          repliesHtml += `
            <div class="reply-sheet">
              <span class="reply-time">${r.time}</span>
              <span class="reply-speaker">${r.author}：</span>${r.content}
            </div>
          `;
        });
        forumHtml += `
          <div class="tavern-post-card">
            <div class="post-pin-decor"></div>
            <div class="post-main-sheet">
              <div class="post-meta-header">
                <div class="post-author-box">
                  <div class="author-sigil">${sigil}</div>
                  <div class="author-detail">
                    <span class="author-name-text">${post.author}</span>
                    <span class="author-role-badge">${post.role}</span>
                  </div>
                </div>
                <span class="board-tag ${tagCls}">${post.tag}</span>
              </div>
              <div class="post-headline">${post.title}</div>
              <div class="post-body-text">${post.content}</div>
            </div>
            <div class="post-replies-layer">${repliesHtml}</div>
          </div>
        `;
      });
      forumContainer.innerHTML = forumHtml;
    }

    /* ==================== 折叠/展开控制 ==================== */
    function toggleStatusPanel() {
      const panel = document.getElementById('statusPanel');
      panel.classList.toggle('is-collapsed');
      panel.classList.toggle('is-open-panel');
      const isCollapsed = panel.classList.contains('is-collapsed');
      const toggleTxt = panel.querySelector('.fold-status-txt');
      if (toggleTxt) {
        toggleTxt.innerText = isCollapsed ? '展开手札' : '收起手札';
      }
    }

    /* ==================== Tab 切换 ==================== */
    function switchGourmetTab(tabKey, btnElement) {
      document.querySelectorAll('.gourmet-tab-btn').forEach(btn => {
        btn.classList.remove('active');
        const bar = btn.querySelector('span');
        if (bar) bar.remove();
      });
      btnElement.classList.add('active');
      const span = document.createElement('span');
      btnElement.appendChild(span);
      document.querySelectorAll('.gourmet-tab-page').forEach(page => {
        page.classList.remove('active');
      });
      const target = document.getElementById('tab-' + tabKey);
      if (target) target.classList.add('active');
    }

    /* ==================== 通用折叠 (NPC & 信函) ==================== */
    function toggleFold(card) {
      card.classList.toggle('is-open');
      if (card.classList.contains('mail-envelope')) {
        card.classList.add('read');
      }
    }

    /* ==================== 待办勾选 ==================== */
    function toggleTodo(item) {
      item.classList.toggle('done');
    }

    /* ==================== 缩放控制器 ==================== */
    const DESIGN_WIDTH = 390;
    const MIN_SCALE = 0.6;
    const MAX_SCALE = 1.6;
    let currentScale = 1.0;
    const SCALE_KEY = 'gourmet_status_scale_pref_v4';
    const LEGACY_SCALE_KEY = 'gourmet_status_scale_pref_v3';
    let scaleResizeObserver = null;
    let scaleHeightRaf = 0;

    function getStorageTargets() {
      const targets = [];
      const add = target => {
        if (!target || targets.includes(target)) return;
        targets.push(target);
      };

      add(window);
      try { add(window.parent); } catch (e) {}
      try { add(window.top); } catch (e) {}
      return targets;
    }

    function normalizeScale(value) {
      const parsed = parseFloat(value);
      if (isNaN(parsed)) return null;
      return Math.min(Math.max(parseFloat(parsed.toFixed(1)), MIN_SCALE), MAX_SCALE);
    }

    function readSavedScale() {
      const targets = getStorageTargets();

      /* 新楼层通常会重建当前文档，优先从上层页面的内存值恢复。 */
      for (const target of targets) {
        try {
          const value = normalizeScale(target.__gourmetStatusScale);
          if (value !== null) return value;
        } catch (e) {}
      }

      /* 再尝试当前层 / 父层 / 顶层的 localStorage。 */
      for (const target of targets) {
        try {
          const value = normalizeScale(target.localStorage.getItem(SCALE_KEY));
          if (value !== null) return value;
        } catch (e) {}
        try {
          const legacyValue = normalizeScale(target.localStorage.getItem(LEGACY_SCALE_KEY));
          if (legacyValue !== null) return legacyValue;
        } catch (e) {}
      }

      return null;
    }

    function saveScale(scale) {
      const normalized = normalizeScale(scale);
      if (normalized === null) return;

      const targets = getStorageTargets();
      for (const target of targets) {
        try {
          target.__gourmetStatusScale = normalized;
        } catch (e) {}

        try {
          target.localStorage.setItem(SCALE_KEY, String(normalized));
        } catch (e) {}
      }
    }

    function getContainerWidth() {
      const container = document.getElementById('outerContainer');
      if (!container) return DESIGN_WIDTH;
      return container.clientWidth;
    }

    function calcAutoScale() {
      const containerWidth = getContainerWidth();
      let scale = containerWidth / DESIGN_WIDTH;
      if (scale > 1) scale = 1;
      if (scale < MIN_SCALE) scale = MIN_SCALE;
      return parseFloat(scale.toFixed(2));
    }

    function getEffectiveScale(scale) {
      let normalized = normalizeScale(scale);
      if (normalized === null) normalized = 1.0;

      /* 窄屏不允许视觉宽度超过容器，避免手机端横向被裁切。 */
      const containerWidth = getContainerWidth();
      if (containerWidth < DESIGN_WIDTH) {
        normalized = Math.min(normalized, calcAutoScale());
      }

      return normalized;
    }

    function syncScaledHeight() {
      cancelAnimationFrame(scaleHeightRaf);
      scaleHeightRaf = requestAnimationFrame(() => {
        const container = document.getElementById('outerContainer');
        const wrapper = document.getElementById('statusRoot');
        if (!container || !wrapper) return;

        /* transform 只改变视觉尺寸，不参与文档流；这里同步真实占位高度。 */
        const naturalHeight = wrapper.offsetHeight;
        container.style.height = Math.max(0, naturalHeight * currentScale) + 'px';
      });
    }

    function ensureScaleHeightObserver() {
      const wrapper = document.getElementById('statusRoot');
      if (!wrapper || typeof ResizeObserver === 'undefined') return;

      if (scaleResizeObserver) {
        try { scaleResizeObserver.disconnect(); } catch (e) {}
      }

      scaleResizeObserver = new ResizeObserver(() => {
        syncScaledHeight();
      });
      scaleResizeObserver.observe(wrapper);
    }

    function applyScale(scale) {
      currentScale = getEffectiveScale(scale);
      const wrapper = document.getElementById('statusRoot');
      if (wrapper) {
        wrapper.style.transform = `scale(${currentScale})`;
      }
      const display = document.getElementById('scaleDisplay');
      if (display) {
        display.innerText = Math.round(currentScale * 100) + '%';
      }
      syncScaledHeight();
    }

    function initScale() {
      const savedScale = readSavedScale();
      const containerWidth = getContainerWidth();

      if (savedScale !== null) {
        currentScale = savedScale;
      } else if (containerWidth < DESIGN_WIDTH) {
        currentScale = calcAutoScale();
      } else {
        currentScale = 1;
      }

      applyScale(currentScale);
      ensureScaleHeightObserver();
      syncScaledHeight();
    }

    function changeUIScale(delta) {
      const requestedScale = normalizeScale(currentScale + delta);
      if (requestedScale === null) return;

      applyScale(requestedScale);
      saveScale(currentScale);
    }

    window.addEventListener('resize', () => {
      const savedScale = readSavedScale();
      const containerWidth = getContainerWidth();

      if (savedScale !== null) {
        applyScale(savedScale);
      } else if (containerWidth < DESIGN_WIDTH) {
        applyScale(calcAutoScale());
      } else {
        applyScale(1);
      }

      syncScaledHeight();
    });

    try {
      initScale();
    } catch (err) {
      console.error("缩放初始化出错:", err);
    }

    try {
      renderGourmetJournal();
    } catch (err) {
      console.error("渲染手札面板出错:", err);
    }
  </script>
</body>
